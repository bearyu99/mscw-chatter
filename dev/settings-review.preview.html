<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설정 변경 로컬 검토</title><style>body{margin:24px;background:#f7f8fa;color:#252831;font-family:system-ui,sans-serif}h1{font-size:22px}p{font-size:14px}nav{display:flex;gap:16px;flex-wrap:wrap}iframe{border:1px solid #d5d7dd;border-radius:10px;display:block;max-width:100%}.view{margin:24px 0}button,a{font-size:14px}</style></head><body><h1>설정 변경 로컬 검토</h1><p>API 호출 없이 보는 데스크톱 설정 샘플입니다. 요금은 UI 검토용 모의 데이터입니다.</p><output id="layout-results" aria-live="polite">배치 검증 중…</output><nav><a href="#desktop">기본 화면</a><a href="#mobile320">320px</a><a href="#mobile375">375px</a><a href="#mobile414">414px</a><a href="#tablet768">768px</a><a href="#states">입력 상태</a></nav><script type="module">const results=new Map();window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.kind!=='settings-review-layout')return;results.set(event.data.viewport,event.data);document.querySelector('#layout-results').textContent=JSON.stringify([...results.values()].sort((a,b)=>a.viewport-b.viewport))});for(const [id,width] of [['desktop',1000],['mobile320',320],['mobile375',375],['mobile414',414],['tablet768',768]]){const section=document.createElement('section');section.className='view';section.id=id;section.innerHTML=`<h2>${width}px</h2><iframe title="${width}px 설정 검토" src="./settings-review.frame.html" width="${width}" height="2200"></iframe>`;document.body.append(section)}const section=document.createElement('section');section.id='states';section.innerHTML='<h2>단축키 버튼의 8가지 상태</h2><iframe title="단축키 상태 검토" src="./settings-review.frame.html?states=1" width="768" height="1200"></iframe>';document.body.append(section)</script></body></html>
