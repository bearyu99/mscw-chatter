<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제공자 선택 반응형 검토</title><style>body{font-family:system-ui;margin:20px;background:#f7f8fa}iframe{display:block;border:1px solid #ddd;margin-bottom:24px}output{display:block;max-width:1000px;overflow-wrap:anywhere}</style></head><body><h1>제공자 선택 반응형 검토</h1><p>가짜 키와 모의 번역만 사용하는 로컬 검토 화면입니다.</p><output id="results">검토 화면 준비 중</output><script type="module">const results=new Map();window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.kind!=='provider-layout')return;results.set(event.data.width,event.data);document.querySelector('#results').textContent=JSON.stringify([...results.values()])});for(const width of [320,375,414,768,1000]){const title=document.createElement('h2');title.textContent=`${width}px`;const frame=document.createElement('iframe');frame.width=width;frame.height=800;frame.title=`${width}px 제공자 선택`;frame.src='./provider-switch.preview.html?layout=1';document.body.append(title,frame)}</script></body></html>
