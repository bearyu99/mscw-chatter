name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main build run ID
        required: true
        type: string
      tag:
        description: Existing draft release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Verify build provenance and draft release
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const tag = process.env.RELEASE_TAG;
            if (!/^\d+$/.test(process.env.BUILD_RUN_ID)) throw new Error('Invalid build run ID');
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a vMAJOR.MINOR.PATCH tag');
            const runId = Number(process.env.BUILD_RUN_ID);
            if (!Number.isSafeInteger(runId)) throw new Error('Invalid build run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: runId });
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.head_branch !== 'main' || run.head_repository?.full_name !== `${repo.owner}/${repo.repo}` ||
                run.path !== '.github/workflows/build.yml' || !['push', 'workflow_dispatch'].includes(run.event)) {
              throw new Error('Only a successful main build from this repository can be published');
            }
            const { data: source } = await github.rest.repos.getContent({ ...repo, path: 'package.json', ref: run.head_sha });
            if (Array.isArray(source) || source.type !== 'file' || source.encoding !== 'base64') throw new Error('Missing package metadata');
            const version = JSON.parse(Buffer.from(source.content, 'base64').toString('utf8')).version;
            if (`v${version}` !== tag) throw new Error('Tag differs from the built package version');
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            const release = releases.find(item => item.tag_name === tag);
            if (!release?.draft || !release.body?.trim()) throw new Error('Prepare a draft release with notes first');
            try {
              const { data: ref } = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              let object = ref.object;
              while (object.type === 'tag') object = (await github.rest.git.getTag({ ...repo, tag_sha: object.sha })).data.object;
              if (object.type !== 'commit' || object.sha !== run.head_sha) throw new Error('Existing tag differs from the built source');
            } catch (error) { if (error.status !== 404) throw error; }
            core.setOutput('sha', run.head_sha);
            core.setOutput('version', version);
            core.setOutput('release_id', release.id);
            core.info(`Source ${run.head_sha}; build ${runId}; release ${release.id}`);

      - name: Download tested Windows binaries
        uses: actions/download-artifact@v8
        with:
          name: mscw-chatter-Windows-x64
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-assets/windows
          digest-mismatch: error

      - name: Download tested Apple Silicon binaries
        uses: actions/download-artifact@v8
        with:
          name: mscw-chatter-macOS-arm64
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-assets/macos-arm64
          digest-mismatch: error

      - name: Download tested Intel Mac binaries
        uses: actions/download-artifact@v8
        with:
          name: mscw-chatter-macOS-x64
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-assets/macos-x64
          digest-mismatch: error

      - name: Upload portable EXE, per-architecture app ZIPs and checksums, then publish
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          APP_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_ID: ${{ steps.source.outputs.release_id }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const repo = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const version = process.env.APP_VERSION;
            const specs = [
              { directory: 'windows', name: `mscw-chatter-${version}-win-x64-portable.exe`, type: 'application/vnd.microsoft.portable-executable' },
              { directory: 'macos-arm64', name: `mscw-chatter-${version}-mac-arm64.zip`, type: 'application/zip' },
              { directory: 'macos-x64', name: `mscw-chatter-${version}-mac-x64.zip`, type: 'application/zip' },
            ];
            // Validate all binaries before writing any Release assets. Never execute downloaded code.
            const files = [];
            for (const spec of specs) {
              const data = await fs.readFile(path.join('release-assets', spec.directory, 'release', spec.name));
              const signature = spec.directory === 'windows' ? '4d5a' : '504b0304';
              if (data.length < 1024 || data.subarray(0, signature.length / 2).toString('hex') !== signature) throw new Error(`Invalid binary: ${spec.name}`);
              files.push({ ...spec, data, hash: crypto.createHash('sha256').update(data).digest('hex') });
            }
            const sums = Buffer.from(files.map(file => `${file.hash}  ${file.name}\n`).join(''), 'utf8');
            files.push({ name: 'SHA256SUMS.txt', type: 'text/plain', data: sums, hash: crypto.createHash('sha256').update(sums).digest('hex') });
            let { data: release } = await github.rest.repos.getRelease({ ...repo, release_id: releaseId });
            if (!release.draft || release.tag_name !== process.env.RELEASE_TAG) throw new Error('Draft changed during publication');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: releaseId, per_page: 100 });
            for (const file of files) {
              let asset = assets.find(item => item.name === file.name);
              if (asset) {
                if (asset.state !== 'uploaded' || asset.size !== file.data.length || asset.digest !== `sha256:${file.hash}`) {
                  throw new Error(`Existing asset differs; refusing to overwrite ${file.name}`);
                }
              } else {
                ({ data: asset } = await github.rest.repos.uploadReleaseAsset({
                  ...repo, release_id: releaseId, name: file.name, data: file.data,
                  headers: { 'content-type': file.type, 'content-length': file.data.length },
                }));
              }
              if (asset.state !== 'uploaded' || asset.size !== file.data.length || asset.digest !== `sha256:${file.hash}`) throw new Error(`Upload verification failed: ${file.name}`);
              core.info(`${file.hash}  ${file.name}`);
            }
            const { data: published } = await github.rest.repos.updateRelease({
              ...repo, release_id: releaseId, target_commitish: process.env.SOURCE_SHA, draft: false, make_latest: 'true',
            });
            await core.summary.addHeading('Release published').addLink(published.name, published.html_url)
              .addRaw(`\n\nSource: ${process.env.SOURCE_SHA}\n\n`)
              .addCodeBlock(sums.toString('utf8'), 'text').write();

  pages:
    needs: publish
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ inputs.tag }}
      build_run_id: ${{ inputs.build_run_id }}
