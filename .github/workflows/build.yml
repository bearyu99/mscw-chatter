name: Verify and package desktop app
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            script: dist:win
            name: Windows-x64
            package-dir: release/win-unpacked
            executable: release/win-unpacked/mscw-chatter.exe
            archive: win-x64-portable.exe
          - os: macos-15
            script: dist:mac:arm64
            name: macOS-arm64
            package-dir: release/mac-arm64/mscw-chatter.app
            executable: release/mac-arm64/mscw-chatter.app/Contents/MacOS/mscw-chatter
            archive: mac-arm64.zip
          - os: macos-15-intel
            script: dist:mac:x64
            name: macOS-x64
            package-dir: release/mac/mscw-chatter.app
            executable: release/mac/mscw-chatter.app/Contents/MacOS/mscw-chatter
            archive: mac-x64.zip
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }} -- --publish never
      - name: Test packaged app on its native architecture
        env:
          MSCW_TEST_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: npm run test:desktop
      - name: Measure package size and verify bundled languages
        env:
          MSCW_PACKAGE_DIR: ${{ matrix.package-dir }}
          MSCW_PACKAGE_ARCHIVE: ${{ matrix.archive }}
        run: npm run measure:package
      - uses: actions/upload-artifact@v4
        with:
          name: mscw-chatter-${{ matrix.name }}
          compression-level: 0
          path: |
            release/*.exe
            release/*.zip
            artifacts/package-size.json
          if-no-files-found: error
