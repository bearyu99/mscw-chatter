name: Verify and package desktop app
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            script: dist:win
          - os: macos-14
            script: dist:mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }} -- --publish never
      - name: Test packaged macOS app
        if: runner.os == 'macOS'
        env:
          MSCW_TEST_EXECUTABLE: ${{ github.workspace }}/release/mac-universal/mscw-chatter.app/Contents/MacOS/mscw-chatter
        run: npm run test:desktop
      - name: Test packaged Windows app
        if: runner.os == 'Windows'
        env:
          MSCW_TEST_EXECUTABLE: ${{ github.workspace }}/release/win-unpacked/mscw-chatter.exe
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: mscw-chatter-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
